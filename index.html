<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4fe9">
<title>Memory</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d29;--mu:#6b7080;--ac:#5b4fe9;--ok:#1a9d5c;--ko:#d6455d;--bd:#e3e5ee}
@media(prefers-color-scheme:dark){:root{--bg:#14151c;--card:#1e2029;--tx:#eceef6;--mu:#9a9fb2;--ac:#8b82ff;--bd:#2e3140}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:var(--bd);color:var(--tx)}button.ok{background:var(--ok)}button.ko{background:var(--ko)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600}
.p0{background:#f5a62333;color:#c77b00}.p1{background:#1a9d5c33;color:var(--ok)}.p2{background:#d6455d33;color:var(--ko)}
.num{font-size:20px;font-weight:700}.mu{color:var(--mu);font-size:14px}
.chat{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.m{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--ac);color:#fff}.m small{display:block;opacity:.65;font-size:11px}
.row{display:flex;gap:8px}.row input{flex:1}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);background:var(--ac);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600;display:none;z-index:9}
.badge{background:var(--ko);color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;margin-left:6px}
img.shot{max-width:100%;border-radius:10px;margin-top:8px}
</style></head><body>
<div class="toast" id="toast"></div>
<main><h1><span>Memory</span><button class="s" id="out" style="display:none;padding:6px 12px">Déconnexion</button></h1><div id="app" class="mu">Chargement…</div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,updateDoc,addDoc,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const CFG={price:4000,mvola:"038 87 706 67",orange:"037 81 446 17",days:30,admin:"mintofitahiana@gmail.com"};
const app=initializeApp({apiKey:"AIzaSyCn5BwFhFtI0Ywn0DwCGUwwY46dQRTQ_w0",authDomain:"memory-app-3e8cc.firebaseapp.com",projectId:"memory-app-3e8cc",storageBucket:"memory-app-3e8cc.firebasestorage.app",messagingSenderId:"1011336887028",appId:"1:1011336887028:web:f1c222bd6e96dadbeebca1"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
let user=null,admin=false,msgs=[],pays=[],grants={},openUid=null,first=true,unsubs=[],shot=null;
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.18)}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";beep();setTimeout(()=>e.style.display="none",4500);
  try{if(document.hidden&&Notification.permission==="granted")new Notification("Memory",{body:t})}catch(x){}}
$("out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];msgs=[];pays=[];grants={};first=true;user=u;
  $("out").style.display=u?"":"none";
  if(!u){authView();return}
  admin=(u.email||"").toLowerCase()===CFG.admin.toLowerCase();
  try{Notification.requestPermission()}catch(e){}
  const err=()=>{};
  if(admin){
    unsubs.push(onSnapshot(collection(db,"messages"),s=>onMsgs(s),err));
    unsubs.push(onSnapshot(collection(db,"payments"),s=>{if(!first)s.docChanges().forEach(c=>{if(c.type==="added"||c.type==="modified"){const d=c.doc.data();if(d.status==="pending")toast("Paiement à vérifier : "+(d.name||""))}});pays=s.docs.map(d=>({id:d.id,...d.data()}));render()},err));
    unsubs.push(onSnapshot(collection(db,"grants"),s=>{grants={};s.docs.forEach(d=>grants[d.id]=d.data());render()},err));
  }else{
    unsubs.push(onSnapshot(query(collection(db,"messages"),where("uid","==",u.uid)),s=>onMsgs(s),err));
    unsubs.push(onSnapshot(doc(db,"payments",u.uid),s=>{pays=s.exists()?[{id:s.id,...s.data()}]:[];render()},err));
    unsubs.push(onSnapshot(doc(db,"grants",u.uid),s=>{grants=s.exists()?{[u.uid]:s.data()}:{};render()},err));
  }
  setTimeout(()=>{first=false},2500);render()});

function onMsgs(s){if(!first)s.docChanges().forEach(c=>{if(c.type==="added"){const d=c.doc.data();
  if(admin&&d.from==="student")toast((d.name||"Étudiant")+" : "+(d.text||"").slice(0,60));
  if(!admin&&d.from==="admin")toast("Réponse de l’administrateur")}});
  msgs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at);render()}

function authView(){let reg=false;
  const draw=()=>{$("app").innerHTML=`<div class="c"><h2>${reg?"Créer un compte":"Connexion"}</h2>
  ${reg?'<label>Nom</label><input id="an">':""}<label>E-mail</label><input id="ae" type="email" autocomplete="email">
  <label>Mot de passe (6 caractères minimum)</label><input id="ap" type="password" autocomplete="${reg?"new-password":"current-password"}">
  <p id="aerr" style="color:var(--ko);margin:8px 0"></p>
  <div class="row"><button id="ag">${reg?"S’inscrire":"Se connecter"}</button><button class="s" id="at">${reg?"J’ai déjà un compte":"Créer un compte"}</button></div></div>`;
  $("at").onclick=()=>{reg=!reg;draw()};
  $("ag").onclick=async()=>{const e=$("ae").value.trim(),p=$("ap").value;$("aerr").textContent="";
    try{if(reg){const n=$("an").value.trim();if(!n)throw{code:"nom"};const r=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(r.user,{displayName:n})}
      else await signInWithEmailAndPassword(auth,e,p)}
    catch(x){$("aerr").textContent=({"nom":"Entrez votre nom.","auth/invalid-email":"E-mail invalide.","auth/weak-password":"Mot de passe trop court.","auth/email-already-in-use":"Cet e-mail a déjà un compte."})[x.code]||"Identifiants incorrects."}}};
  draw()}

function chatHtml(uid){const l=msgs.filter(m=>m.uid===uid);
  return `<div class="chat" id="chat">${l.map(m=>`<div class="m ${(m.from==="admin")===admin?"me":""}">${esc(m.text)}<small>${fmt(m.at)}</small></div>`).join("")||'<span class="mu">Aucun message.</span>'}</div>
  <div class="row"><input id="mt" placeholder="Écrire un message…" autocomplete="off"><button id="ms">Envoyer</button></div>`}
function bindChat(uid,name){const f=async()=>{const t=$("mt").value.trim();if(!t)return;$("mt").value="";
  try{await addDoc(collection(db,"messages"),{uid,name:name||"",from:admin?"admin":"student",text:t,at:Date.now()})}catch(e){toast("Envoi impossible")}};
  $("ms").onclick=f;$("mt").onkeydown=e=>{if(e.key==="Enter")f()};const c=$("chat");if(c)c.scrollTop=c.scrollHeight}
function render(){if(!user||!$("app"))return;const a=document.activeElement,id=a&&a.id,v=id&&$(id)&&a.type!=="file"?$(id).value:null;
  admin?renderAdmin():renderStudent();if(id&&$(id)&&v!==null){$(id).value=v;$(id).focus()}}

function compress(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");
  c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};i.onerror=rej;i.src=URL.createObjectURL(file)})}

function renderStudent(){const g=grants[user.uid],p=pays[0],ok=g&&g.until>Date.now();
  const st=ok?`<span class="pill p1">Actif jusqu’au ${new Date(g.until).toLocaleDateString("fr-FR")}</span>`
   :p&&p.status==="pending"?`<span class="pill p0">Paiement en cours de vérification</span>`
   :p&&p.status==="rejected"?`<span class="pill p2">Paiement refusé – écrivez-nous ci-dessous</span>`
   :`<span class="pill p2">Pas d’abonnement</span>`;
  const left=ok?Math.ceil((g.until-Date.now())/864e5):0;
  $("app").innerHTML=`<div class="c"><h2>Bonjour ${esc(user.displayName||"")}</h2>${st}${ok&&left<=5?`<p class="mu">Il reste ${left} jour(s) : pensez à renouveler.</p>`:""}</div>
  ${ok?`<div class="c"><h2>Quiz et leçons</h2><span class="mu">Vos contenus Memory apparaîtront ici.</span></div>`:""}
  <div class="c"><h2>1. Envoyez ${CFG.price} MGA</h2><div class="mu">MVola</div><div class="num">${CFG.mvola}</div>
  <div class="mu" style="margin-top:8px">Orange Money</div><div class="num">${CFG.orange}</div></div>
  <div class="c"><h2>2. Confirmez votre paiement</h2>
  <label>Numéro utilisé pour payer</label><input id="fp" type="tel" value="${esc(p?.phone||"")}">
  <label>Opérateur</label><select id="fo"><option>MVola</option><option>Orange Money</option><option>Airtel Money</option></select>
  <label>Référence de la transaction</label><input id="fr">
  <label>Heure du paiement</label><input id="ft" type="time">
  <label>Capture d’écran (facultatif)</label><input id="fi" type="file" accept="image/*">
  <p style="margin:12px 0 0"><button id="fs">J’ai payé</button></p></div>
  <div class="c"><h2>Discuter avec l’administrateur</h2>${chatHtml(user.uid)}</div>`;
  $("fi").onchange=async e=>{shot=e.target.files[0]?await compress(e.target.files[0]).catch(()=>null):null};
  $("fs").onclick=async()=>{const d={name:user.displayName||"",phone:$("fp").value.trim(),op:$("fo").value,ref:$("fr").value.trim(),time:$("ft").value,status:"pending",at:Date.now()};
    if(!d.ref||!d.time)return toast("Remplissez la référence et l’heure");if(shot)d.shot=shot;
    try{await setDoc(doc(db,"payments",user.uid),d);shot=null;await addDoc(collection(db,"messages"),{uid:user.uid,name:d.name,from:"student",text:`Paiement ${d.op} · réf ${d.ref} · ${d.time}`,at:Date.now()})}catch(e){toast("Envoi impossible")}};
  bindChat(user.uid,user.displayName)}

function renderAdmin(){
  const list=[...pays].sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||b.at-a.at);
  const uids=[...new Set([...pays.map(p=>p.id),...msgs.map(m=>m.uid)])];
  const nm=u=>pays.find(x=>x.id===u)?.name||msgs.find(m=>m.uid===u&&m.name)?.name||"Étudiant";
  const sel=openUid&&uids.includes(openUid)?openUid:null;
  const unread=u=>{const l=msgs.filter(m=>m.uid===u);return l.length&&l[l.length-1].from==="student"?'<span class="badge">!</span>':""};
  $("app").innerHTML=`<div class="c"><h2>Paiements à vérifier</h2>${list.map(p=>`<div style="border-top:1px solid var(--bd);padding:10px 0">
  <b>${esc(p.name)}</b> · ${esc(p.phone)}<br><span class="mu">${esc(p.op)} · réf <b>${esc(p.ref)}</b> · ${esc(p.time)} · ${fmt(p.at)}</span><br>
  <span class="pill p${p.status==="pending"?0:p.status==="approved"?1:2}">${p.status==="pending"?"En attente":p.status==="approved"?"Validé":"Refusé"}</span>
  ${p.shot?`<img class="shot" src="${p.shot}">`:""}
  <div class="row" style="margin-top:8px"><button class="ok" data-a="${p.id}">Valider</button><button class="ko" data-r="${p.id}">Refuser</button><button class="s" data-c="${p.id}">Discuter</button></div></div>`).join("")||'<span class="mu">Aucun paiement.</span>'}</div>
  <div class="c"><h2>Conversations</h2>${uids.map(u=>`<button class="s" style="margin:0 6px 6px 0" data-c="${u}">${esc(nm(u))}${unread(u)}</button>`).join("")||'<span class="mu">Aucune conversation.</span>'}
  ${sel?`<div style="margin-top:10px">${chatHtml(sel)}</div>`:""}</div>`;
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{openUid=b.dataset.c;render()});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const id=b.dataset.a,g=grants[id],base=g&&g.until>Date.now()?g.until:Date.now();
    try{await setDoc(doc(db,"grants",id),{until:base+CFG.days*864e5});await updateDoc(doc(db,"payments",id),{status:"approved"});
    await addDoc(collection(db,"messages"),{uid:id,name:nm(id),from:"admin",text:"Paiement validé, votre abonnement est actif. Merci !",at:Date.now()})}catch(e){toast("Action impossible")}});
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const id=b.dataset.r;
    try{await updateDoc(doc(db,"payments",id),{status:"rejected"});await addDoc(collection(db,"messages"),{uid:id,name:nm(id),from:"admin",text:"Paiement non retrouvé. Pouvez-vous vérifier la référence et l’heure ?",at:Date.now()})}catch(e){toast("Action impossible")}});
  if(sel)bindChat(sel,nm(sel))}
</script></body></html>
